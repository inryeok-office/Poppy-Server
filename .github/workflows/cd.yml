name: CD

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record deployment start
        id: deployment_start
        shell: bash
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Notify Discord on start
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFICATION_TYPE: cd
          CD_STATUS: start
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          ENVIRONMENT: develop
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          DEPLOYMENT_STAGE: INITIALIZING
          HEALTH_STATUS: 해당 없음
        run: bash scripts/discord-notify.sh send

      - name: Sync remote server
        id: sync
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e

            cd ~/Poppy-Server

            echo "=== Syncing with origin/develop ==="
            git fetch origin
            git reset --hard origin/develop

            echo "=== Latest commit ==="
            git log -1 --oneline

      - name: Run remote precheck
        id: precheck
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e

            cd ~/Poppy-Server

            echo "=== Checking .env file ==="
            if [ ! -f .env ]; then
              echo "ERROR: .env file not found. Aborting deployment."
              exit 1
            fi

            echo "=== Disk space check ==="
            df -h / | tail -1

            echo "=== Cleaning up unused images ==="
            sudo docker image prune -f

            echo "=== Validating Docker Compose configuration ==="
            sudo docker compose config --quiet

      - name: Notify Discord before application replacement
        if: ${{ success() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFICATION_TYPE: cd
          CD_STATUS: replacement
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          ENVIRONMENT: develop
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          DEPLOYMENT_STAGE: REPLACEMENT
          HEALTH_STATUS: 해당 없음
        run: bash scripts/discord-notify.sh send

      - name: Build and deploy application
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e

            cd ~/Poppy-Server

            echo "=== Building and deploying ==="
            sudo docker compose up -d --build

      - name: Check application health
        id: health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e

            cd ~/Poppy-Server

            echo "=== Health check (up to 60s) ==="
            deadline=$(( $(date +%s) + 60 ))
            attempt=1
            response_file="/tmp/poppy-health-response.$$"
            trap 'rm -f "$response_file"' EXIT

            while [ "$(date +%s)" -lt "$deadline" ]; do
              remaining=$(( deadline - $(date +%s) ))
              if curl -fsS --max-time "$remaining" -o "$response_file" \
                http://localhost:8080/actuator/health \
                && grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"' "$response_file"; then
                echo "Health check passed"
                exit 0
              fi

              remaining=$(( deadline - $(date +%s) ))
              if [ "$remaining" -le 0 ]; then
                break
              fi
              echo "Waiting for health check... ($attempt)"
              sleep "$(( remaining < 5 ? remaining : 5 ))"
              attempt=$(( attempt + 1 ))
            done

            echo "ERROR: Health check failed, dumping recent logs"
            sudo docker inspect -f 'container_status={{.State.Status}} exit_code={{.State.ExitCode}}' poppy-app || true
            sudo docker logs poppy-app --tail 50 || true
            exit 1

      - name: Determine deployment failure
        id: failure_info
        if: ${{ always() }}
        shell: bash
        run: |
          if [ "${{ steps.sync.outcome }}" = "failure" ]; then
            stage="SYNC"
            reason="origin/develop 동기화 실패"
          elif [ "${{ steps.precheck.outcome }}" = "failure" ]; then
            stage="PRECHECK"
            reason="서버 .env 또는 Docker 사전 점검 실패"
          elif [ "${{ steps.deploy.outcome }}" = "failure" ]; then
            stage="DEPLOY"
            reason="Docker build/deploy 실패"
          elif [ "${{ steps.health.outcome }}" = "failure" ]; then
            stage="HEALTH_CHECK"
            reason="60초 내 health status UP 확인 실패"
          else
            stage="UNKNOWN"
            reason="Deploy step failed — Actions 로그 확인"
          fi

          {
            echo "stage=$stage"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Discord on success
        if: ${{ success() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFICATION_TYPE: cd
          CD_STATUS: success
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          ENVIRONMENT: develop
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          DEPLOYMENT_STAGE: HEALTH_CHECK
          HEALTH_STATUS: UP
        run: |
          export CD_DURATION_SECONDS=$(( $(date +%s) - ${{ steps.deployment_start.outputs.epoch }} ))
          bash scripts/discord-notify.sh send

      - name: Notify Discord on failure
        if: ${{ always() && failure() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFICATION_TYPE: cd
          CD_STATUS: failure
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          ENVIRONMENT: develop
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          DEPLOYMENT_STAGE: ${{ steps.failure_info.outputs.stage }}
          FAILURE_REASON: ${{ steps.failure_info.outputs.reason }}
          HEALTH_STATUS: 확인 불가
        run: |
          export CD_DURATION_SECONDS=$(( $(date +%s) - ${{ steps.deployment_start.outputs.epoch }} ))
          bash scripts/discord-notify.sh send
