name: Retroactive GitHub Automation

on:
  workflow_dispatch:
    inputs:
      closed_pr_numbers:
        description: "Assignee/라벨을 소급 적용하고 연결 Issue를 종료할 이미 병합된 PR 번호(쉼표 구분)"
        required: false
        default: "2,4,6,8,10,12,14"
      open_pr_numbers:
        description: "Assignee/Reviewer/라벨을 적용할 열린 PR 번호(쉼표 구분, 종료/병합하지 않음)"
        required: false
        default: "15"
      expected_issue_numbers:
        description: "연결 PR을 통해 종료되었는지 확인할 Issue 번호(쉼표 구분)"
        required: false
        default: "1,3,5,7,9,11,13"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  retroactive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run retroactive automation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLOSED_PR_NUMBERS: ${{ inputs.closed_pr_numbers }}
          OPEN_PR_NUMBERS: ${{ inputs.open_pr_numbers }}
          EXPECTED_ISSUE_NUMBERS: ${{ inputs.expected_issue_numbers }}
        run: node .github/scripts/retroactive.js
