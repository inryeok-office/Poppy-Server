spring:
  application:
    name: Poppy-Server
poppy:
  agent:
    heartbeat-timeout-seconds: ${POPPY_AGENT_HEARTBEAT_TIMEOUT_SECONDS:90}
    heartbeat-scan-interval-milliseconds: ${POPPY_AGENT_HEARTBEAT_SCAN_INTERVAL_MILLISECONDS:30000}
    heartbeat-offline-batch-size: ${POPPY_AGENT_HEARTBEAT_OFFLINE_BATCH_SIZE:100}
  execution:
    queue-dispatch-enabled: ${POPPY_EXECUTION_QUEUE_DISPATCH_ENABLED:true}
    queue-dispatch-interval-milliseconds: ${POPPY_EXECUTION_QUEUE_DISPATCH_INTERVAL_MILLISECONDS:1000}
    offline-recovery-enabled: ${POPPY_EXECUTION_OFFLINE_RECOVERY_ENABLED:true}
    offline-recovery-interval-milliseconds: ${POPPY_EXECUTION_OFFLINE_RECOVERY_INTERVAL_MILLISECONDS:30000}
    offline-recovery-batch-size: ${POPPY_EXECUTION_OFFLINE_RECOVERY_BATCH_SIZE:100}
  session:
    inactivity-timeout: ${POPPY_SESSION_INACTIVITY_TIMEOUT:PT1H}
    expiration-enabled: ${POPPY_SESSION_EXPIRATION_ENABLED:true}
    expiration-scan-interval-milliseconds: ${POPPY_SESSION_EXPIRATION_SCAN_INTERVAL_MILLISECONDS:60000}
    recovery-attempt-window: ${POPPY_SESSION_RECOVERY_ATTEMPT_WINDOW:PT1M}
    recovery-max-attempts: ${POPPY_SESSION_RECOVERY_MAX_ATTEMPTS:5}
    recovery-attempt-cleanup-interval-milliseconds: ${POPPY_SESSION_RECOVERY_ATTEMPT_CLEANUP_INTERVAL_MILLISECONDS:60000}
