spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:poppy}
    username: ${DB_USERNAME:poppy}
    password: ${DB_PASSWORD:poppy}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
poppy:
  agent:
    token: ${POPPY_AGENT_TOKEN:}
  admin:
    # 개발용 계정 비밀번호(평문): poppy-dev-admin
    username: ${POPPY_ADMIN_USERNAME:admin}
    password-hash: ${POPPY_ADMIN_PASSWORD_HASH:$2a$10$YXHp87tDI7IlMXR6TsBSoeh0V8VJeP8AMniSWAv8aexrYwXEz3d/y}
